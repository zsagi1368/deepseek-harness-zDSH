name: Plugin Governance CI

# Targeted quality lane for the plugin governance stack (our/v2 additions on
# top of the official 0.1.1-rc.2 baseline):
#   - packages/plugins/plugin-governance  (spec/registry/guards/sandbox/persistence)
#   - packages/host/plugin-governance-host (web-app governance gateway)
#   - packages/client/ui-plugin-manager    (settings UI)
#
# Modeled on .github/workflows/ci.yml (checkout / pnpm setup / store cache),
# but scoped: instead of the full gate matrix this lane runs the three
# governance suites plus the workspace typecheck, so plugin-governance PRs get
# fast signal without queueing behind the whole CI matrix. Runs on hosted
# ubuntu-latest — unlike ci.yml this workflow does not depend on the
# enterprise runner pools or the failover variables.
on:
  push:
    paths:
      - 'packages/plugins/**'
      - 'packages/host/plugin-governance-host/**'
      - 'packages/client/ui-plugin-manager/**'
      - '.github/workflows/plugin-governance.yml'
  pull_request:
    paths:
      - 'packages/plugins/**'
      - 'packages/host/plugin-governance-host/**'
      - 'packages/client/ui-plugin-manager/**'
      - '.github/workflows/plugin-governance.yml'

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

# Cancel a superseded pull-request run on a new push so a fresh head does not
# queue a second run behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: node 24 / governance tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Unlike ci.yml (restore-only: ci-master seeds the default-branch cache)
      # this lane owns its cache lifecycle — actions/cache saves the store back
      # after a successful install so follow-up runs stay warm standalone.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # NOTE: the host package directory is packages/host/plugin-governance-host
      # (package @deepseek-ai/dsh-plugin-governance-host).
      - name: Run governance test suites
        run: >-
          pnpm vitest run
          packages/plugins/plugin-governance
          packages/host/plugin-governance-host
          packages/client/ui-plugin-manager

      - name: Typecheck
        run: pnpm typecheck
